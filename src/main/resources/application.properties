spring.application.name=SpringBootSecurityEx

# Load optional, ignored local development settings from the project-root .env file.
spring.config.import=optional:file:.env[.properties]


# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjdXJlSldUVFNjcmV0S2V5Rm9yU3ByaW5nQm9vdDIwMjY=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# CORS
# =========================================================
app.cors.allowed-origin-patterns=http://localhost:4200


# =========================================================
# BOOTSTRAP USERS
# =========================================================


app.bootstrap.enabled=true

# SUPER ADMIN
app.bootstrap-super-admin.username=superadmin
app.bootstrap-super-admin.email=superadmin@gmail.com
app.bootstrap-super-admin.password=superadmin123

# ADMIN
app.bootstrap-admin.username=admin
app.bootstrap-admin.email=admin@gmail.com
app.bootstrap-admin.password=admin123

# VENDOR
app.bootstrap-vendor.username=vendor
app.bootstrap-vendor.email=vendor@gmail.com
app.bootstrap-vendor.password=vendor123

# CUSTOMER
app.bootstrap-customer.username=customer
app.bootstrap-customer.email=customer@gmail.com
app.bootstrap-customer.password=customer123

# DELIVERY
app.bootstrap-delivery.username=delivery
app.bootstrap-delivery.email=delivery@gmail.com
app.bootstrap-delivery.password=delivery123


# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# SERVER
# =========================================================
app.product-images.storage-directory=${PRODUCT_IMAGE_STORAGE_DIR:${user.home}/.springbootsecurity/product-images}
app.product-images.max-file-size-bytes=${PRODUCT_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
app.product-images.max-width=${PRODUCT_IMAGE_MAX_WIDTH:4096}
app.product-images.max-height=${PRODUCT_IMAGE_MAX_HEIGHT:4096}
app.product-images.max-pixels=${PRODUCT_IMAGE_MAX_PIXELS:12000000}
app.product-images.max-files-per-upload=${PRODUCT_IMAGE_MAX_FILES_PER_UPLOAD:10}
spring.servlet.multipart.max-file-size=${PRODUCT_IMAGE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${PRODUCT_IMAGE_MAX_REQUEST_SIZE:55MB}
server.port=8080
